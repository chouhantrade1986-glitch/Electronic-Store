<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="android-compat.css?v=20260410a" />
  <link rel="stylesheet" href="amazon-theme.css?v=20260411a" />
  <title>Product</title>
  <script src="android-compat.js?v=20260410a"></script>
</head>
<body>
  <p>Redirecting to product details...</p>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const id = String(params.get('id') || '').trim();
      if (!id) {
        window.location.replace('products.html');
        return;
      }
      window.location.replace('product-detail.html?id=' + encodeURIComponent(id));
    })();
  </script>
</body>
</html>
