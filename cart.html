<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="android-compat.css?v=20260410a" />
  <title>ElectroMart Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260315c" />
  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="shared-search.css?v=20260314g" />

  <link rel="stylesheet" href="amazon-theme.css?v=20260411a" />
  <script src="android-compat.js?v=20260410a"></script>
</head>
<body>
  <div id="headerContainer"></div>

  <main class="cart-main">
    <section class="cart-listing">
      <div class="section-head">
        <h1>Your Cart</h1>
        <p id="cartMeta">0 items</p>
      </div>
      <p class="price-col-head">Price</p>
      <div id="cartItems" class="cart-items"></div>
      <div class="cart-actions">
        <button id="clearCart" class="clear-btn" type="button">Clear Cart</button>
      </div>
    </section>

    <aside class="cart-summary">
      <p class="summary-items" id="summaryItems">Subtotal (0 items):</p>
      <p class="summary-total"><strong id="totalValue">INR 0</strong></p>
      <div class="delivery-box">
        <h2>Delivery Estimate</h2>
        <p id="cartDeliveryEstimate" class="delivery-estimate">Choose a slot at checkout for the earliest available delivery window.</p>
        <p id="cartReservationMessage" class="reservation-message"></p>
      </div>
      <div class="coupon-box">
        <label for="couponInput">Coupon code</label>
        <div class="coupon-row">
          <input id="couponInput" type="text" placeholder="SAVE10" />
          <button id="applyCouponBtn" type="button">Apply</button>
        </div>
        <p id="couponMessage" class="coupon-message"></p>
        <button id="removeCouponBtn" type="button" class="remove-coupon-btn" hidden>Remove coupon</button>
      </div>
      <button id="checkoutBtn" type="button">Proceed to Checkout</button>
      <p class="secure-line">Secure checkout with encrypted payment.</p>
      <hr />
      <h2>Order Summary</h2>
      <p><span>Subtotal</span><strong id="subtotalValue">INR 0</strong></p>
      <p><span>Shipping</span><strong id="shippingValue">INR 0</strong></p>
      <p id="discountRow" hidden><span>Discount</span><strong id="discountValue">-INR 0</strong></p>
      <p><span>Tax</span><strong id="taxValue">INR 0</strong></p>
      <p class="total"><span>Order Total</span><strong id="orderTotalValue">INR 0</strong></p>
    </aside>
  </main>

  <script src="cart.js"></script>
  <script src="menu-manager.js"></script>
  <script src="auth-state.js"></script>
  <script src="shared-search.js?v=20260314g"></script>
  <script src="header.js"></script>
</body>
</html>
