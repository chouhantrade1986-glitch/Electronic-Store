<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="android-compat.css?v=20260410a" />
  <title>ElectroMart Password Assistance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260315c" />
  <link rel="stylesheet" href="shared-ui.css?v=20260314b" />
  <link rel="stylesheet" href="auth.css?v=20260411b" />
  <link rel="stylesheet" href="amazon-theme.css?v=20260411a" />
  <script src="android-compat.js?v=20260410a"></script>
</head>
<body>
  <main class="auth-main">
    <!-- Centered Brand Wordmark -->
    <div class="amz-auth-logo-wrap">
      <a href="index.html" class="amz-auth-brand-logo" aria-label="ElectroMart Home">
        <span class="amz-logo-text">Electro<span class="amz-logo-accent">Mart</span><span class="amz-logo-tld">.in</span></span>
      </a>
    </div>

    <!-- Centered Amazon India Password Assistance Card (#authCard) -->
    <section id="authCard" class="auth-panel amz-auth-card">
      <h1 id="forgotHeading" data-i18n="forgot_heading">Password assistance</h1>
      <p id="forgotSubheading" data-i18n="forgot_subheading" style="margin: 0 0 14px; font-size: 13px; color: var(--amazon-muted); line-height: 1.4;">
        Enter the email address or mobile phone number associated with your ElectroMart account.
      </p>

      <form id="forgotForm" novalidate style="display: grid; gap: 12px;">
        <div id="forgotStep1">
          <label for="forgotIdentifier">
            <span data-i18n="login_identifier_label">Email or mobile phone number</span>
          </label>
          <div class="amz-phone-input-wrap">
            <span class="amz-country-prefix" aria-label="India country code">IN +91</span>
            <input id="forgotIdentifier" type="text" required autofocus />
          </div>

          <button id="forgotContinueBtn" type="button" class="amz-btn-auth-primary" data-i18n="login_continue" style="margin-top: 10px;">
            Continue
          </button>
        </div>

        <!-- Step 2: OTP & New Password -->
        <div id="forgotStep2" style="display: none; border-top: 1px solid #eaeded; padding-top: 12px;">
          <p id="forgotOtpNotice" class="otp-assist-line subtle" style="font-size: 12px; margin: 0 0 10px;"></p>

          <label for="forgotOtp">
            <span data-i18n="enter_otp">Enter OTP</span>
            <input id="forgotOtp" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit OTP" style="height: 34px; width: 100%; border: 1px solid #888c8c; border-radius: 4px; padding: 0 10px; font: inherit;" />
          </label>

          <div style="margin-top: 10px;">
            <label for="forgotNewPassword">
              <span data-i18n="password">New Password</span>
            </label>
            <div class="amz-password-wrap">
              <input id="forgotNewPassword" type="password" required minlength="6" placeholder="At least 6 characters" />
              <button type="button" class="amz-toggle-pwd-btn" data-target="forgotNewPassword" aria-label="Toggle password visibility" title="Show/Hide password">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button id="forgotSubmitBtn" type="submit" class="amz-btn-auth-primary" data-i18n="password_assistance_reset_btn" style="margin-top: 14px;">
            Reset Password and Sign In
          </button>
        </div>

        <div style="margin-top: 12px; border-top: 1px solid #eaeded; padding-top: 12px;">
          <a href="login.html" class="auth-link-btn" data-i18n="back_to_signin_link" style="text-decoration: none;">
            ‹ Back to sign in
          </a>
        </div>
      </form>

      <!-- Feedback Alert Area -->
      <p id="authMessage" class="auth-message" role="alert" aria-live="polite"></p>
    </section>

    <!-- Minimalist Auth Footer -->
    <footer class="amz-auth-footer">
      <div class="amz-auth-footer-links">
        <a href="terms.html" data-i18n="auth_conditions_of_use">Conditions of Use</a>
        <a href="privacy.html" data-i18n="auth_privacy_notice">Privacy Notice</a>
        <a href="account.html" data-i18n="auth_help_link">Help</a>
      </div>
      <p class="amz-auth-copyright" data-i18n="auth_footer_copyright">© 2026, ElectroMart.in, Inc. or its affiliates</p>
    </footer>
  </main>

  <!-- Script Sequence -->
  <script src="translations.js"></script>
  <script src="universal-i18n-bus.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
