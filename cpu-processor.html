<!DOCTYPE html>
<html lang="en">
<head>

<body data-page="cpu_processor">
  <div id="headerContainer"></div>

  <main class="page-main">
    <section class="hero">
      <p id="pageTitle" class="eyebrow">Component</p>
      <h1 id="pageHeadline">Component Listing</h1>
      <p id="pageSubtitle">Filtered product listing.</p>
    </section>

    <section class="filters" aria-label="Filter products">
      <select id="brandFilter" aria-label="Filter brand">
        <option value="all">All Brands</option>
      </select>
      <select id="segmentFilter" aria-label="Filter segment">
        <option value="all">All Segments</option>
        <option value="b2c">B2C</option>
        <option value="b2b">B2B</option>
      </select>
      <select id="sortFilter" aria-label="Sort products">
        <option value="relevance">Sort: Relevance</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="rating_desc">Top Rated</option>
      </select>
      <select id="quickNav" aria-label="Quick navigate" onchange="if(this.value) window.location.href=this.value;">
        <option value="">Quick Navigate</option>
        <option value="barebone-desktop.html">Barebone Desktop</option>
        <option value="branded-desktop.html">Branded Desktop</option>
        <option value="cpu-processor.html">CPU (Processor)</option>
        <option value="cpu-fan.html">CPU (Fan)</option>
        <option value="motherboard.html">Motherboard</option>
        <option value="desktop-ram-memory.html">Desktop RAM</option>
        <option value="graphics-card-gpu.html">Graphics Card</option>
        <option value="cabinet.html">Cabinet</option>
        <option value="cabinet-fan.html">Cabinet Fan</option>
        <option value="power-supply-smps.html">Power Supply</option>
        <option value="ups-ups-batteries.html">UPS Batteries</option>
      </select>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="listTitle">Available Items</h2>
        <p id="resultMeta" role="status" aria-live="polite" aria-atomic="true">Showing 0 products</p>
      </div>
      <div id="itemGrid" class="item-grid"></div>
    </section>
  </main>

  <script src="listing-filter-chips.js?v=20260314c"></script>
  <script src="component-pages.js?v=20260315b"></script>
  <script src="shared-search.js?v=20260314g"></script>
  <script src="header.js"></script>
